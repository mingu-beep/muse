<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        lang="en" data-bs-theme="auto">

    <header class="p-3 mb-3 border-bottom" th:fragment="main-header">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 link-body-emphasis text-decoration-none">
                    <svg class="bi me-2" width="40" height="32" role="img" aria-label="Bootstrap"><use xlink:href="#bootstrap"></use></svg>
                </a>

                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                    <li>
                        <a th:if="${menu == 'all'}" href="/"         class="nav-link px-2 link-secondary">ALL</a>
                        <a th:unless="${menu == 'all'}" href="/"         class="nav-link px-2 link-body-emphasis">All</a>
                    </li>
                    <li>
                        <a th:if="${menu == 'today'}" href="/today"         class="nav-link px-2 link-secondary">TODAY</a>
                        <a th:unless="${menu == 'today'}" href="/today"         class="nav-link px-2 link-body-emphasis">Today</a>
                    </li>
                    <li>
                        <a th:if="${menu == 'popular'}" href="/popular"         class="nav-link px-2 link-secondary">POPULAR</a>
                        <a th:unless="${menu == 'popular'}" href="/popular"         class="nav-link px-2 link-body-emphasis">Popular</a>
                    </li>
<!--                    <li><a href="#" class="nav-link px-2 link-body-emphasis">Products</a></li>-->
                </ul>

                <form class="col-12 col-lg-4 mb-3 mb-lg-0 me-lg-3" role="search" method="GET" action="/musics">

                    <div class="input-group">
                        <select class="form-select" id="inputGroupSelect02" name="type">
                            <option selected value="all">All</option>
                            <option value="title">Title</option>
                            <option value="artist">Artist</option>
                            <option value="mood">Mood</option>
                        </select>
                        <input type="search" class="form-control" placeholder="Search..." aria-label="Search" name="keyword">

<!--                        <input type="text" class="form-control" aria-label="Text input with dropdown button">-->
                    </div>

                </form>



                <div sec:authorize="isAnonymous()" class="text-end">
                    <button type="button" class="btn btn-light me-2" onclick="location.href='/login';">
                        Login
                    </button>
                    <button type="button" class="btn btn-warning" onclick="location.href='/signup';">Sign-up</button>
                </div>

                <div sec:authorize="isAuthenticated()" class="dropdown text-end">
                    <a href="#" class="d-block link-body-emphasis text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                        <img th:src="@{/images/{profile}(profile=${#authentication.principal.getProfileImage()})}" errors="/img/white.png" alt="mdo" width="32" height="32" class="rounded-circle">
                    </a>
                    <ul class="dropdown-menu text-small" style="">
                        <li><a class="dropdown-item" href="/musics/upload">New music...</a></li>
                        <li><a class="dropdown-item" href="#">Settings</a></li>
                        <li><a class="dropdown-item" th:href="@{/user/{userId}(userId=${#authentication.principal.user.id})}">Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/logout">Sign out</a></li>
                    </ul>
                </div>

            </div>
        </div>
    </header>

    <header th:fragment="admin-header" class="navbar sticky-top bg-dark flex-md-nowrap p-0 shadow" data-bs-theme="dark">

        <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3 fs-6 text-white" href="/">Muse</a>

        <ul class="navbar-nav flex-row d-md-none">
            <li class="nav-item text-nowrap">
                <button class="nav-link px-3 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSearch" aria-controls="navbarSearch" aria-expanded="false" aria-label="Toggle search">
                    <svg class="bi"><use xlink:href="#search"></use></svg>
                </button>
            </li>
            <li class="nav-item text-nowrap">
                <button class="nav-link px-3 text-white" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
                    <svg class="bi"><use xlink:href="#list"></use></svg>
                </button>
            </li>
        </ul>

        <div id="navbarSearch" class="navbar-search w-100 collapse">
            <input class="form-control w-100 rounded-0 border-0" type="text" placeholder="Search" aria-label="Search">
        </div>

    </header>
</html>
